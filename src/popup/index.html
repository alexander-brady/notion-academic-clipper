<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles/app.css" />
  </head>
  <body class="w-[380px]">
    <!-- Not connected --------------------------------------------------- -->
    <section data-screen="setup" hidden>
      <div class="px-6 pt-[30px] pb-[34px] text-center">
        <div class="text-3xl">🔗</div>
        <h1 class="mt-2.5 mb-1.5 text-[15px] font-semibold">Connect to Notion</h1>
        <p class="text-muted mb-3.5 text-[12.5px]">
          Add your integration token and share a database with it to start clipping.
        </p>
        <button id="open-options" class="btn btn-primary">Open setup</button>
      </div>
    </section>

    <!-- Main clip form -------------------------------------------------- -->
    <section data-screen="clip" class="flex max-h-[580px] flex-col" hidden>
      <header class="border-line flex items-center justify-between gap-2 border-b px-3 py-2.5">
        <div class="text-muted flex min-w-0 items-center gap-[7px] text-xs">
          <span id="status-dot" class="bg-muted size-[7px] flex-none rounded-full"></span>
          <span id="source-line" class="truncate">Reading page…</span>
        </div>
        <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </header>

      <div class="flex flex-col gap-2.5 overflow-y-auto p-3">
        <!-- Not a <label>: it contains a button, and a label would forward the
             click to the select. -->
        <div>
          <span class="field-label" id="database-label">Database</span>
          <div class="flex items-center gap-1.5">
            <select
              id="database"
              class="input cursor-pointer appearance-none"
              aria-labelledby="database-label"
            ></select>
            <button id="reload-dbs" class="icon-btn" title="Reload databases" aria-label="Reload databases">
              ⟳
            </button>
          </div>
        </div>

        <label class="block">
          <span class="field-label">Title</span>
          <textarea id="title" class="input resize-y" rows="2" placeholder="Page title"></textarea>
        </label>

        <label class="block">
          <span class="field-label">URL</span>
          <input id="url" class="input" type="url" />
        </label>

        <div class="grid grid-cols-[1fr_88px] gap-2.5">
          <label class="block">
            <span class="field-label">DOI</span>
            <input id="doi" class="input" placeholder="10.xxxx/xxxxx" />
          </label>
          <label class="block">
            <span class="field-label">Year</span>
            <input id="year" class="input" inputmode="numeric" placeholder="2024" />
          </label>
        </div>

        <label class="block">
          <span class="field-label">
            Authors <span class="font-normal normal-case opacity-75">comma separated</span>
          </span>
          <input id="authors" class="input" placeholder="Jane Doe, Richard Roe" />
        </label>

        <label class="block">
          <span class="field-label">Journal / venue</span>
          <input id="journal" class="input" />
        </label>

        <details class="disclosure" id="bibtex-box">
          <summary>
            <span class="flex-1">BibTeX</span>
            <span class="badge" id="bibtex-source">…</span>
          </summary>
          <textarea
            id="bibtex"
            class="input resize-y font-mono text-[11.5px]"
            rows="9"
            spellcheck="false"
          ></textarea>
          <div class="flex justify-end gap-1.5">
            <button id="copy-bibtex" class="btn btn-ghost btn-sm">Copy</button>
            <button id="refetch-bibtex" class="btn btn-ghost btn-sm">Re-fetch from DOI</button>
          </div>
        </details>

        <details class="disclosure" id="mapping-box">
          <summary>
            <span class="flex-1">Field mapping</span>
            <span class="badge" id="mapping-count"></span>
          </summary>
          <p class="text-muted text-[11.5px]">Where each clipped value is written in this database.</p>
          <div id="mapping"></div>
        </details>

        <div id="notice" hidden></div>
      </div>

      <footer class="border-line border-t px-3 py-2.5">
        <button id="save" class="btn btn-primary w-full">
          <span id="save-label">Save to Notion</span>
        </button>
      </footer>
    </section>

    <!-- Saved ----------------------------------------------------------- -->
    <section data-screen="done" hidden>
      <div class="px-6 pt-[30px] pb-[34px] text-center">
        <div class="text-3xl">✅</div>
        <h1 class="mt-2.5 mb-1.5 text-[15px] font-semibold">Saved to Notion</h1>
        <p
          id="done-title"
          class="text-fg max-h-[60px] overflow-hidden text-[12.5px] font-semibold break-words"
        ></p>
        <div class="mt-3.5 flex justify-center gap-1.5">
          <button id="open-page" class="btn btn-primary">Open in Notion</button>
          <button id="clip-again" class="btn btn-ghost">Back</button>
        </div>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
